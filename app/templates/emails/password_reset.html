{% extends "emails/_base.html" %}
{% block body %}
<h2 style="margin:0 0 10px;">Reset your password</h2>
<p style="margin:0 0 14px; color:#374151;">
  Someone requested a password reset for your account.
</p>
<p style="margin:0 0 18px;">
  <a href="{{ reset_url }}" style="display:inline-block; background:#2563eb; color:#fff; text-decoration:none; padding:10px 14px; border-radius:10px;">
    Reset password
  </a>
</p>
<p style="margin:0; color:#6b7280; font-size:12px;">
  If you didn't request this, you can ignore this email.<br>
  Link (valid for a limited time):<br>
  <span style="word-break:break-all;">{{ reset_url }}</span>
</p>
{% endblock %}
